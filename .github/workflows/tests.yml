name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover tests

  # An ordinary gate since Q39: the suite passes on Windows. Some tests skip
  # there for want of $HOME (Q43) -- they run everywhere else, and a plain run
  # reports OK either way, so the count is capped. Lower it when Q43 lands;
  # raise it only with a reason.
  unittest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/skip-ceiling.py --max-skips 40
