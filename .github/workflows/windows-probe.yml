name: windows-probe

# Runs tests/windows-probe/README.md sections 0-3 on a hosted Windows runner,
# so the cmd.exe label-seek question is settled by a reproducible job rather
# than by asking someone to type six lines into their own cmd.exe.
#
# No step may abort the job: a variant that fails IS the result, and the
# remaining variants still have to run. That needs three separate things --
# `if: always()` so a red step doesn't skip the rest, `ver > nul` to reset
# ERRORLEVEL (echo does not, so a failing variant leaks its 255 to the step),
# and `bash {0}` to drop the -eo pipefail GitHub adds to bash steps.

on:
  push:
    branches: ["claude/windows-probe-ci"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Line endings are the variable under test. If the checkout rewrote them,
      # every result below is meaningless, so this runs before anything else.
      - name: 0. Checkout state
        shell: cmd
        run: |
          ver
          git config core.autocrlf
          git rev-parse --short HEAD
          python tests\windows-probe\check-bytes.py

      # The perturbation set is the decisive one: current/pad01/pad07/pad13 are
      # identical logic at shifted byte offsets. All four OK means LF-only
      # survives the shift and the hazard is not reachable here.
      - name: 1. cmd.exe, one line per variant
        if: always()
        shell: cmd
        run: |
          echo === current ===
          echo {"ping":1} | tests\windows-probe\variant-current.cmd probe.py
          echo exit=%ERRORLEVEL%
          echo === pad01 ===
          echo {"ping":1} | tests\windows-probe\variant-pad01.cmd probe.py
          echo exit=%ERRORLEVEL%
          echo === pad07 ===
          echo {"ping":1} | tests\windows-probe\variant-pad07.cmd probe.py
          echo exit=%ERRORLEVEL%
          echo === pad13 ===
          echo {"ping":1} | tests\windows-probe\variant-pad13.cmd probe.py
          echo exit=%ERRORLEVEL%
          echo === labelfree ===
          echo {"ping":1} | tests\windows-probe\variant-labelfree.cmd probe.py
          echo exit=%ERRORLEVEL%
          echo === mixed ===
          echo {"ping":1} | tests\windows-probe\variant-mixed.cmd probe.py
          echo exit=%ERRORLEVEL%
          echo done
          ver > nul

      # variant-mixed is the one at risk here: its heredoc delimiter carries a
      # carriage return and the shell has to match it.
      - name: 2. Git Bash
        if: always()
        shell: bash {0}
        run: |
          for v in current labelfree mixed; do
            echo "=== $v ==="
            echo '{"ping":1}' | tests/windows-probe/variant-$v.cmd probe.py
            echo "exit=$?"
          done

      # C:\Windows must be OFF the path, not just the tool dirs: the Python
      # launcher installs py.exe there, so the README's
      # `PATH=C:\Windows\system32;C:\Windows` still resolves `py -3`.
      - name: 3. No-interpreter path
        if: always()
        shell: cmd
        run: |
          set "PATH=C:\Windows\system32"
          where py & where python & where python3
          echo === current, no python ===
          echo {"ping":1} | tests\windows-probe\variant-current.cmd probe.py
          echo exit=%ERRORLEVEL%
          echo === labelfree, no python ===
          echo {"ping":1} | tests\windows-probe\variant-labelfree.cmd probe.py
          echo exit=%ERRORLEVEL%
          echo done
          ver > nul

      # What the getuid fix needed a Windows box to answer. Already answered in
      # #103 against a live Claude Code install; this is the runner's view.
      - name: 4. Temp roots
        if: always()
        shell: cmd
        run: |
          python -c "import tempfile; print('gettempdir=' + tempfile.gettempdir())"
          echo TEMP=%TEMP%
          echo LOCALAPPDATA=%LOCALAPPDATA%
          dir /b "%TEMP%" | findstr /i claude

      # Whether the 8.3 short name gettempdir() can return breaks the session
      # allow PR #103 adds. realpath resolves short names, but only for paths
      # that exist, so both sides have to be checked against a real directory.
      - name: 5. Short-name resolution
        if: always()
        shell: cmd
        run: python tests\windows-probe\shortname.py
